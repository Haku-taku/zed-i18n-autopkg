name: Package upstream release

# Watches LI-NA/zed-i18n for a published release, repackages its Linux tarballs
# into the FHS layout the official Arch package installs, and publishes those
# trees here with a PKGBUILD whose digests are rendered from them.
#
# This repository never merges upstream source. Upstream already builds the
# editor; the only thing this repo owns is the Arch staging step, so an upstream
# release is consumed as assets and there is nothing to conflict with.
#
# The release is the deliverable. Nothing is pushed to the AUR: take the
# rendered PKGBUILD from the release and build with makepkg wherever you
# package.

on:
  schedule:
    # Upstream releases every few days. Hourly detection keeps the packaged
    # output within an hour of a release at negligible cost.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to package (default: newest published release)"
        required: false
        default: ""
      dry_run:
        description: "Build and verify, but publish no release assets"
        required: false
        type: boolean
        default: false
      force:
        description: "Repackage even when this tag already has a release (re-runs are idempotent)"
        required: false
        type: boolean
        default: false

concurrency:
  group: package-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPOSITORY: LI-NA/zed-i18n
  # The staging trees are published as release assets of this repository, and
  # the PKGBUILD's `url` points here, so keep them equal.
  PACKAGING_REPOSITORY: ${{ github.repository }}

jobs:
  detect:
    name: Find an un-packaged upstream release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      needed: ${{ steps.pick.outputs.needed }}
    steps:
      - name: Pick the newest upstream release this repository has not packaged
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            # Releases, not tags: an upstream tag exists before its assets do,
            # and a package cannot be built from a release that has not
            # finished uploading.
            tag="$(gh api "repos/$UPSTREAM_REPOSITORY/releases?per_page=20" \
              --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name]
                    | map(select(test("^v[0-9.]+-i18n\\.[0-9]+$")))
                    | first // empty')"
          fi
          if [[ -z "$tag" ]]; then
            echo "No published upstream release found." >&2
            exit 1
          fi
          echo "Newest upstream release: $tag"
          # A release here is the marker that this tag was packaged. `force`
          # exists because that marker says nothing about *which* assets were
          # produced: adding a job that emits new ones has to be able to re-run
          # a tag that already shipped.
          if [[ "${{ inputs.force }}" == "true" ]]; then
            echo "Force requested; repackaging $tag."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --repo "$PACKAGING_REPOSITORY" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: Stage ${{ needs.detect.outputs.tag }}
    needs: detect
    if: ${{ needs.detect.outputs.needed == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # A tag push at the end needs history and a writable remote.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Verify the staging layout is still the official Arch one
        run: |
          # Runs against a synthetic bundle: staging never reads the payload,
          # only member names, so this guards the package's file contract
          # without downloading a release first.
          python3 -m unittest tests.test_layout -v

      - name: Download the upstream Linux tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Only the universal Linux tarballs are needed: completions are
          # generated from the x86_64 one and both arches carry every locale.
          gh release download "$TAG" --repo "$UPSTREAM_REPOSITORY" \
            --dir dist \
            --pattern 'zed-i18n-linux-x86_64.tar.gz' \
            --pattern 'zed-i18n-linux-aarch64.tar.gz'
          ls -l dist

      - name: Stage the Arch trees and render the PKGBUILD
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          # The staging step runs the bundled CLI to capture shell completions,
          # so the runner must match one of the downloaded architectures.
          uv run --no-project python scripts/package_release.py \
            --dist-dir dist \
            --release-tag "$TAG" \
            --repository "$PACKAGING_REPOSITORY"

      - name: Verify the rendered PKGBUILD against the trees beside it
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, re, sys
          from pathlib import Path

          dist = Path("dist")
          text = (dist / "PKGBUILD").read_text(encoding="utf-8")
          ok = True
          for arch in ("x86_64", "aarch64"):
              tree = dist / f"zed-i18n-linux-{arch}-pkgdir.tar.gz"
              digest = hashlib.sha256(tree.read_bytes()).hexdigest()
              line = f"sha256sums_{arch}=('{digest}')"
              if line not in text:
                  print(f"PKGBUILD does not carry {line}", file=sys.stderr)
                  ok = False
              # The zeros in the template are a tripwire, not a placeholder.
              if "0" * 64 in text:
                  print("PKGBUILD still carries a zero digest", file=sys.stderr)
                  ok = False
          if not ok:
              raise SystemExit(1)
          print("PKGBUILD digests match the staged trees")
          PY

      - name: Publish the release assets
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          # Same tag as upstream, so `_tag="v$pkgver-i18n.$_i18nrev"` in the
          # PKGBUILD resolves here.
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          # Forced re-runs land on an existing release, so creation is
          # conditional and uploads clobber.
          if ! gh release view "$TAG" --repo "$PACKAGING_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$PACKAGING_REPOSITORY" \
              --title "zed-i18n $TAG (Arch Linux packaging)" \
              --notes "Arch staging trees, rendered PKGBUILD and Arch packages for upstream $TAG." \
              --verify-tag
          fi
          gh release upload "$TAG" \
            --repo "$PACKAGING_REPOSITORY" \
            dist/zed-i18n-linux-x86_64-pkgdir.tar.gz \
            dist/zed-i18n-linux-aarch64-pkgdir.tar.gz \
            dist/PKGBUILD \
            --clobber

      - name: Summarize a dry run
        if: ${{ inputs.dry_run == true }}
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          echo "Dry run: staged $TAG; nothing was published." >> "$GITHUB_STEP_SUMMARY"
          ls -l dist >> "$GITHUB_STEP_SUMMARY"


  makepkg:
    name: Build .pkg.tar.zst packages
    needs:
      - detect
      - package
    # GitHub has no Arch Linux runner, so makepkg comes from the official image.
    # It is x86_64 only, which is enough for both packages: package() only
    # copies the staged tree, so the aarch64 package is the same file copy under
    # CARCH=aarch64 --ignorearch. Nothing is compiled, so no cross toolchain and
    # no arm runner are involved.
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    container:
      image: archlinux/archlinux:latest
      options: --privileged
    env:
      TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - name: Install makepkg
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed base-devel git github-cli zstd libarchive

      - name: Fetch the rendered PKGBUILD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The published copy, not the template: its sha256sums describe the
          # trees beside it, and it is the file this job is meant to prove
          # buildable.
          mkdir -p /work
          gh release download "$TAG" --repo "$PACKAGING_REPOSITORY" \
            --dir /work --pattern 'PKGBUILD'
          cat /work/PKGBUILD | head -20

      - name: Build both architectures
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder: /work
          for arch in x86_64 aarch64; do
            mkdir -p "/work/$arch"
            cp /work/PKGBUILD "/work/$arch/"
            chown -R builder: "/work/$arch"
            # --nodeps: the runtime dependencies are the package's contract with
            # the system, not something this container has to satisfy.
            # --nocheck: the PKGBUILD has no check() function.
            # --ignorearch: only for aarch64, where the host is not the target.
            # `[[ ]] && extra+=(...)` would return 1 for x86_64 and take the
            # whole step down under `set -e`; the if-block keeps the status 0.
            extra=()
            if [[ "$arch" == aarch64 ]]; then
              extra+=(--ignorearch)
            fi
            runuser -u builder -- env CARCH="$arch" HOME=/home/builder \
              bash -c "cd /work/$arch && makepkg -f --nodeps --nocheck ${extra[*]}"
          done

      - name: Verify the packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          for arch in x86_64 aarch64; do
            pkg=(/work/$arch/*.pkg.tar.zst)
            if [ ${#pkg[@]} -ne 1 ]; then
              echo "expected one package for $arch, found ${#pkg[@]}" >&2
              exit 1
            fi
            # pacman parsing the archive is the check that the metadata is
            # well-formed, not merely present. LC_ALL=C keeps the field labels
            # parseable: pacman translates them, so the container's locale would
            # otherwise decide whether the grep below matches.
            LC_ALL=C pacman -Qip "${pkg[0]}"
            recorded="$(LC_ALL=C pacman -Qip "${pkg[0]}" | awk -F': ' '/^Architecture/ {print $2}')"
            if [[ "$recorded" != "$arch" ]]; then
              echo "package records architecture '$recorded', expected '$arch'" >&2
              exit 1
            fi
            # The installed payload must be the staged tree, not the bundle.
            if ! bsdtar -tf "${pkg[0]}" | grep -qx 'usr/bin/zeditor'; then
              echo "package does not install usr/bin/zeditor" >&2
              exit 1
            fi
            if bsdtar -tf "${pkg[0]}" | grep -q '^usr/lib/lib.*\.so$'; then
              echo "package ships bundled shared libraries" >&2
              exit 1
            fi
          done

      - name: Upload the packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            --repo "$PACKAGING_REPOSITORY" \
            /work/x86_64/*.pkg.tar.zst \
            /work/aarch64/*.pkg.tar.zst \
            --clobber

      - name: Summarize
        run: |
          set -euo pipefail
          {
            echo "### Packages for $TAG"
            echo
            echo '```'
            for arch in x86_64 aarch64; do
              LC_ALL=C pacman -Qip /work/$arch/*.pkg.tar.zst \
                | grep -E '^(Name|Version|Architecture|Installed Size|Compressed Size)'
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
