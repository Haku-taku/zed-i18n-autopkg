name: Package upstream release

# Watches LI-NA/zed-i18n for a published release and turns its Linux tarballs
# into installable Arch packages in one pass: download, restage into the FHS
# layout the official Arch package installs, build both architectures with
# makepkg, publish the packages.
#
# This repository never merges upstream source. Upstream already builds the
# editor; the only thing this repo owns is the Arch staging step, so an upstream
# release is consumed as assets and there is nothing to conflict with.
#
# The release carries the built packages and nothing else. The staging trees and
# the PKGBUILD are intermediate: they exist only inside the run that produces
# the packages, which is why the PKGBUILD's digests never have to agree with a
# previously published tree.

on:
  schedule:
    # Upstream releases every few days. Hourly detection keeps the packages
    # within an hour of a release at negligible cost.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to package (default: newest published release)"
        required: false
        default: ""
      dry_run:
        description: "Build and verify, but publish nothing"
        required: false
        type: boolean
        default: false
      force:
        description: "Rebuild even when this tag already has a release"
        required: false
        type: boolean
        default: false

concurrency:
  group: package-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPOSITORY: LI-NA/zed-i18n
  PACKAGING_REPOSITORY: ${{ github.repository }}

jobs:
  detect:
    name: Find an un-packaged upstream release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      needed: ${{ steps.pick.outputs.needed }}
    steps:
      - name: Pick the newest upstream release this repository has not packaged
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            # Releases, not tags: an upstream tag exists before its assets do,
            # and a package cannot be built from a release that has not
            # finished uploading.
            tag="$(gh api "repos/$UPSTREAM_REPOSITORY/releases?per_page=20" \
              --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name]
                    | map(select(test("^v[0-9.]+-i18n\\.[0-9]+$")))
                    | first // empty')"
          fi
          if [[ -z "$tag" ]]; then
            echo "No published upstream release found." >&2
            exit 1
          fi
          echo "Newest upstream release: $tag"
          # A release here is the marker that this tag was packaged. `force`
          # exists because that marker says nothing about *which* assets were
          # produced: changing how they are built has to be able to re-run a tag
          # that already shipped.
          if [[ "${{ inputs.force }}" == "true" ]]; then
            echo "Force requested; repackaging $tag."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --repo "$PACKAGING_REPOSITORY" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ needs.detect.outputs.tag }}
    needs: detect
    if: ${{ needs.detect.outputs.needed == 'true' }}
    runs-on: ubuntu-24.04
    # GitHub has no Arch Linux runner, so makepkg comes from the official image.
    # It is x86_64 only, which is enough for both packages: package() copies a
    # prebuilt tree and compiles nothing, so the aarch64 package is the same
    # file copy under CARCH=aarch64 --ignorearch. No cross toolchain and no arm
    # runner are involved, because there is no architecture for a compiler to
    # mismatch.
    container:
      image: archlinux/archlinux:latest
      options: --privileged
    env:
      TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - name: Install tooling
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel python git github-cli zstd libarchive

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The publish step pushes a tag, so the remote has to be writable.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the staging layout is still the official Arch one
        run: |
          # Runs against a synthetic bundle: staging never reads the payload,
          # only member names, so this guards the package's file contract
          # without downloading a release first.
          python3 -m unittest tests.test_layout -v

      - name: Download the upstream Linux tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Only the universal Linux tarballs are needed: completions are
          # generated from the x86_64 one and both arches carry every locale.
          gh release download "$TAG" --repo "$UPSTREAM_REPOSITORY" \
            --dir dist \
            --pattern 'zed-i18n-linux-x86_64.tar.gz' \
            --pattern 'zed-i18n-linux-aarch64.tar.gz'
          ls -l dist

      - name: Restage the trees and render the PKGBUILD
        run: |
          set -euo pipefail
          # The staging step runs the bundled CLI to capture shell completions,
          # so the machine must match one of the downloaded architectures.
          python3 scripts/package_release.py \
            --dist-dir dist \
            --release-tag "$TAG" \
            --repository "$PACKAGING_REPOSITORY"

      - name: Verify the rendered PKGBUILD against the trees beside it
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, sys
          from pathlib import Path

          dist = Path("dist")
          text = (dist / "PKGBUILD").read_text(encoding="utf-8")
          ok = True
          for arch in ("x86_64", "aarch64"):
              tree = dist / f"zed-i18n-linux-{arch}-pkgdir.tar.gz"
              digest = hashlib.sha256(tree.read_bytes()).hexdigest()
              line = f"sha256sums_{arch}=('{digest}')"
              if line not in text:
                  print(f"PKGBUILD does not carry {line}", file=sys.stderr)
                  ok = False
              # The zeros in the template are a tripwire, not a placeholder.
              if "0" * 64 in text:
                  print("PKGBUILD still carries a zero digest", file=sys.stderr)
                  ok = False
          if not ok:
              raise SystemExit(1)
          print("PKGBUILD digests match the staged trees")
          PY

      - name: Configure makepkg
        run: |
          set -euo pipefail
          # SRCDEST makes makepkg consume the trees this run just staged
          # instead of fetching them back from a release URL. The digests in the
          # PKGBUILD are still verified, so this is a source location, not a
          # trust bypass.
          #
          # The image's OPTIONS enable `debug`, which splits out a zed-i18n-debug
          # package built from symbols a prebuilt upstream binary does not have;
          # `!strip` keeps makepkg from rewriting a payload it did not compile.
          cp /etc/makepkg.conf /work-makepkg.conf
          sed -i 's/^OPTIONS=.*/OPTIONS=(!strip docs !libtool !staticlibs emptydirs zipman purge !debug !lto)/' \
            /work-makepkg.conf
          printf 'SRCDEST=%s\n' "$PWD/dist" >> /work-makepkg.conf
          grep -E '^(OPTIONS|SRCDEST)=' /work-makepkg.conf

      - name: Build both architectures
        run: |
          set -euo pipefail
          useradd -m builder
          for arch in x86_64 aarch64; do
            mkdir -p "build/$arch"
            cp dist/PKGBUILD "build/$arch/"
            chown -R builder: "build/$arch"
            # --nodeps: the runtime dependencies are the package's contract with
            # the system, not something this container has to satisfy.
            # --nocheck: the PKGBUILD has no check() function.
            # --ignorearch: only for aarch64, where the host is not the target.
            # `[[ ]] && extra+=(...)` would return 1 for x86_64 and take the
            # whole step down under `set -e`; the if-block keeps the status 0.
            extra=()
            if [[ "$arch" == aarch64 ]]; then
              extra+=(--ignorearch)
            fi
            runuser -u builder -- env CARCH="$arch" HOME=/home/builder \
              bash -c "cd '$PWD/build/$arch' && makepkg -f --nodeps --nocheck \
                --config /work-makepkg.conf ${extra[*]}"
          done

      - name: Verify the packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          for arch in x86_64 aarch64; do
            # A debug package here means the OPTIONS override regressed; it is
            # not something to silently drop, because it also means makepkg
            # stripped a payload it did not build.
            debug=(build/$arch/zed-i18n-debug-*.pkg.tar.zst)
            if [ ${#debug[@]} -ne 0 ]; then
              echo "makepkg produced a debug package for $arch" >&2
              exit 1
            fi
            pkg=(build/$arch/zed-i18n-[0-9]*.pkg.tar.zst)
            if [ ${#pkg[@]} -ne 1 ]; then
              echo "expected one package for $arch, found ${#pkg[@]}" >&2
              exit 1
            fi
            # pacman parsing the archive is the check that the metadata is
            # well-formed, not merely present. LC_ALL=C keeps the field labels
            # parseable: pacman translates them, so the container's locale would
            # otherwise decide whether the awk below matches.
            LC_ALL=C pacman -Qip "${pkg[0]}"
            recorded="$(LC_ALL=C pacman -Qip "${pkg[0]}" | awk -F': ' '/^Architecture/ {print $2}')"
            if [[ "$recorded" != "$arch" ]]; then
              echo "package records architecture '$recorded', expected '$arch'" >&2
              exit 1
            fi
            # The installed payload must be the staged tree, not the bundle.
            if ! bsdtar -tf "${pkg[0]}" | grep -qx 'usr/bin/zeditor'; then
              echo "package does not install usr/bin/zeditor" >&2
              exit 1
            fi
            if bsdtar -tf "${pkg[0]}" | grep -q '^usr/lib/lib.*\.so$'; then
              echo "package ships bundled shared libraries" >&2
              exit 1
            fi
            # Completions exist only because staging generated them, so a
            # package that lost them would still install.
            for completion in \
              usr/share/bash-completion/completions/zeditor \
              usr/share/fish/vendor_completions.d/zeditor.fish \
              usr/share/zsh/site-functions/_zeditor; do
              if ! bsdtar -tf "${pkg[0]}" | grep -qx "$completion"; then
                echo "package is missing $completion" >&2
                exit 1
              fi
            done
          done

      - name: Publish the packages
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          # Forced re-runs land on an existing release, so creation is
          # conditional and uploads clobber.
          if ! gh release view "$TAG" --repo "$PACKAGING_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$PACKAGING_REPOSITORY" \
              --title "zed-i18n $TAG (Arch Linux)" \
              --notes "Arch Linux packages for upstream zed-i18n $TAG." \
              --verify-tag
          fi
          # Explicit names rather than a glob: a stray debug package must not
          # reach the release just because it matched.
          gh release upload "$TAG" \
            --repo "$PACKAGING_REPOSITORY" \
            build/x86_64/zed-i18n-[0-9]*.pkg.tar.zst \
            build/aarch64/zed-i18n-[0-9]*.pkg.tar.zst \
            --clobber

      - name: Summarize
        if: ${{ always() }}
        run: |
          {
            echo "### $TAG"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run: nothing was published."
              echo
            fi
            echo '```'
            shopt -s nullglob
            for arch in x86_64 aarch64; do
              for pkg in build/$arch/zed-i18n-[0-9]*.pkg.tar.zst; do
                LC_ALL=C pacman -Qip "$pkg" \
                  | grep -E '^(Name|Version|Architecture|Installed Size|Compressed Size)'
                echo
              done
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
